<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Cast</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>Quest Cast</h1>
  <div id="header-cast-btn">
    <button onclick="startCast()">Cast</button>
  </div>
  <div id="status-bar" style="display:none;">
    <span><span class="val" id="s-fps">--</span> fps</span>
    <span><span class="val" id="s-res">--</span></span>
    <span><span class="val" id="s-frames">--</span> frames</span>
    <span><span class="val" id="s-bw">--</span> MB</span>
    <button id="header-stop-btn" onclick="stopCast()">Stop</button>
  </div>
</header>

<div class="main">
  <div class="video-pane" id="video-pane">
    <img id="live-frame" alt="Quest view">
    <div id="crosshair"></div>
    <div id="drag-overlay"></div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2>Movement</h2>
      <div class="btn-row" style="justify-content:center;">
        <div style="display:grid; grid-template-columns: repeat(3,40px); grid-template-rows: repeat(2,34px); gap:4px;">
          <div></div>
          <button id="btn-fwd" class="secondary" title="W / Up">&#9650;</button>
          <div></div>
          <button id="btn-left" class="secondary" title="A / Left">&#9664;</button>
          <button id="btn-back" class="secondary" title="S / Down">&#9660;</button>
          <button id="btn-right" class="secondary" title="D / Right">&#9654;</button>
        </div>
      </div>
      <div class="speed-row">
        <label>Speed</label>
        <input type="number" id="move-speed" value="0.3" min="0.01" max="2" step="0.05">
        <label>Look</label>
        <input type="number" id="look-speed" value="0.15" min="0.01" max="1" step="0.01">
      </div>
    </div>

    <div class="panel">
      <h2>Pose</h2>
      <div class="pose-readout">
        <span id="p-xyz">0, 0, 0</span>
        <span id="p-yp">0&deg; yaw, 0&deg; pitch</span>
        <span>loop: <span id="p-loop">off</span></span>
      </div>
      <div class="btn-row">
        <button onclick="resetPose()" class="secondary" style="flex:1;">Reset</button>
        <button onclick="goHome()" class="secondary" style="flex:1;">Origin</button>
        <button id="pose-loop-btn" onclick="togglePoseLoop()" class="secondary" style="flex:1;" disabled>Stop Loop</button>
      </div>
    </div>

    <div class="panel">
      <h2>Display</h2>
      <div class="btn-row">
        <button onclick="setConfig(2064,1162)">2064</button>
        <button onclick="setConfig(1920,1080)" class="secondary">1080p</button>
        <button onclick="setConfig(1280,720)" class="secondary">720p</button>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button onclick="setEye('left')">L Eye</button>
        <button onclick="setEye('right')" class="secondary">R Eye</button>
        <button onclick="setEye('stereo')" class="secondary">Stereo</button>
      </div>
    </div>

    <div class="panel">
      <h2>Actions</h2>
      <div class="btn-row">
        <button onclick="sendClick()" style="flex:1;">Click</button>
        <button onclick="sendHome()" class="secondary" style="flex:1;">Home</button>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button onclick="saveScreenshot()" style="flex:1;">Screenshot</button>
        <button onclick="openStream()" class="secondary" style="flex:1;">MJPEG</button>
      </div>
    </div>

    <div class="panel">
      <h2>Keys</h2>
      <div class="keybind-hint">
        <b>WASD</b> / <b>Arrows</b> move &nbsp; <b>IJKL</b> look &nbsp; <b>QE</b> up/down<br>
        <b>Drag</b> on video: free look &nbsp; <b>Right-click</b>: click<br>
        <b>Space</b> click &nbsp; <b>P</b> screenshot &nbsp; <b>Esc</b> reset
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/dashboard.js"></script>
</body>
</html>
